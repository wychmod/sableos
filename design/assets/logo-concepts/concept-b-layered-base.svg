    </linearGradient>
    <linearGradient id="b-glyph" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F9D68F"/>
      <stop offset="1" stop-color="#D4921C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#b-bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
  <path d="M156 148 L232 236 L156 324" fill="none" stroke="url(#b-glyph)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
