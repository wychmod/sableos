spring:
  application:
    name: sableos
  # 宪法 I：HTTP 层用 Spring MVC + Java 21 虚拟线程（不引入响应式）
  threads:
    virtual:
      enabled: true
  datasource:
    # 工作区根下的 SQLite（路径随 workspace.root 联动）；工作区目录由 `sableos init` 创建
    url: jdbc:sqlite:${workspace.root:.sableos}/sableos.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      data-source-properties:
        journal_mode: WAL
        busy_timeout: 5000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # 表结构唯一权威是 db/migration/{vendor}（Flyway），禁止 ddl-auto 改结构（约定见 AGENTS.md §5.1）
      ddl-auto: none
    show-sql: false
    properties:
      # Instant 以 java.sql.Timestamp 绑定（setTimestamp）：sqlite-jdbc 只对「INTEGER 毫秒」可读写往返，
      # 默认 TIMESTAMP_UTC 绑定写出的 ISO 文本读回时会 "Error parsing time stamp"（2026-10-14 实测）。
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    # 双轨迁移目录（sqlite 默认档 / postgresql 部署档），见 sableos-storage 的 migration/README.md
    locations: classpath:db/migration/{vendor}
  # Spring AI Alibaba DashScope starter 的 10 个 autoconfig 全部带 @ConditionalOnDashScopeEnabled，
  # 默认激活且无 key 即启动失败；本应用只显式构造 DashScopeApi/ChatModel，用单开关全部禁用。
  ai:
    dashscope:
      enabled: false

server:
  port: 8080

# 工作区根（默认工作目录下 .sableos/；环境变量 WORKSPACE_ROOT 可覆盖）
workspace:
  root: .sableos

# --- Sandbox 白名单（契约 §7）---
# 四个键各自独立；**空列表 = 该类全部拒绝（deny-all）**，不是"不校验"。
# 最小可用白名单由 `sableos init`（T019）按示例 Agent 需要生成，勿在此预先放宽。
file:
  allowed_paths: []
shell:
  allowed_commands: []
http:
  allowed_domains: []
smtp:
  allowed_endpoints: []

sandbox:
  # 单次工具结果截断阈值；超阈值截断并在结果中标注
  tool_result_max_chars: 16384

# 长期记忆后端：markdown（默认，.sableos/memory/<profile>/MEMORY.md）| sqlite（memory_entries 表）
# | mem0（Mem0 Platform，需 MEM0_API_KEY，可用 MEM0_BASE_URL 覆盖默认 https://api.mem0.ai）
memory:
  backend: markdown

# --- 应用元信息（/actuator/info）---
# 注意：Boot 2.6+ 起 info 端点的 env 贡献者默认关闭，须开 management.info.env.enabled（见下方）。
# version 用 @project.version@（根 POM 的应用版本，发版时自动跟随）；API 版本 v1 属于 URL 前缀与 OpenAPI，不在此处。
info:
  app:
    name: SableOS
    description: 企业能完全掌控的、Java 原生的、私有可审计的 Agent OS（Agent Harness OS）
    version: @project.version@

# --- Observability: Actuator + Micrometer/Prometheus ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  # Boot 2.6+ 默认关闭 info 端点的 env 贡献者；不开启则上方 info.* 属性不会出现在 /actuator/info
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: sableos

# --- 链路标识（traceId / spanId；对外契约见 AGENTS.md §5.1 响应信封 traceId 字段）---
# MDC 共 5 个键：traceId / spanId / sessionId / profileName / channel；
# prod 档的 JSON 输出走 logback-spring.xml 里 LogstashEncoder 的 includeMdcKeyName 白名单，新增键必须同步两处。
sableos:
  observability:
    trace:
      # 是否回写链路响应头（MDC 与信封 traceId 字段不受此开关影响）
      enabled: true
      # 便捷响应头名；网关若改写头名可在此对齐
      response-header: X-Trace-Id
      # 是否同时回写 W3C 的 traceparent / tracestate
      propagate-w3c: true

  # --- Provider 清单（核心能力一；契约见 specs/001-lesson16-provider/contracts/provider-config.md）---
  # 空清单 = 无 provider 可路由（未登记名调用抛点名异常），零 key 可正常启动；凭证一律环境变量占位。
  providers: []
  # 声明示例（按需启用）：
  #  - name: deepseek            # Profile 按此名引用
  #    type: openai              # openai | dashscope，缺省 openai
  #    api-key: ${DEEPSEEK_API_KEY:}
  #    base-url: https://api.deepseek.com

# --- OpenAPI / Swagger UI（springdoc）---
# swagger-ui webjar 由父 POM 覆盖到修补版；此处必须显式声明同一版本：
# springdoc 在 fat jar 内自动探测 webjar 版本会失败并回落到内置默认（5.32.2），
# 导致 /swagger-ui/** 资源 404。构建期由 Maven 资源过滤写入实际版本号，
# 版本真相源保持父 POM 的 <swagger-ui.version> 一处。
springdoc:
  swagger-ui:
    version: @swagger-ui.version@

# Log levels（格式与 appender 在 logback-spring.xml）
logging:
  level:
    root: INFO
    com.sableos: DEBUG
