name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'design/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'design/**'
      - 'docs/**'
      - '**.md'

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# One run per PR / branch; cancel superseded pushes to save runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Full quality gate: spotless → checkstyle → compile → test → pmd/p3c →
      # spotbugs+findsecbugs. Any violation fails the job.
      - name: mvn verify
        run: mvn -B clean verify

  # 008：白名单规则与存储行为必须三平台一致（Windows 路径分隔符 / 盘符、macOS 大小写）。
  # 只跑聚焦测试，全量门禁仍由上面的 Ubuntu job 承担，避免 macOS runner 拖慢流水线。
  sandbox-compat:
    name: Sandbox compat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 跳过静态门禁：本 job 只验证跨平台的运行时行为，格式/规约/安全扫描在 Ubuntu job 已经跑过。
      - name: focused tests
        run: >-
          mvn -B -pl sableos-core,sableos-storage,sableos-tool,sableos-web -am test
          -Dtest='WhitelistRulesTest,WhitelistPolicyRefreshTest,WhitelistSandboxTest,
          SandboxWhitelistAdminTest,SandboxWhitelistEntryRepositoryTest,JpaSandboxWhitelistStoreTest,
          SandboxWhitelistSeedTest,SandboxWhitelistControllerTest'
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dspotless.check.skip=true -Dcheckstyle.skip=true -Dpmd.skip=true
          -Dspotbugs.skip=true -Denforcer.skip=true

  dependency-check:
    name: OWASP Dependency-Check (CVE scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # upload-artifact
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Package only (skip quality plugins already covered by `build`), then run
      # Dependency-Check aggregate. Avoids a second spotless/pmd/spotbugs pass
      # that duplicated ~half the CI time and made CVE failures hard to spot.
      # NVD feed uses Dependency-Check's nightly cache (no NVD API key needed).
      - name: package (skip quality plugins)
        run: >-
          mvn -B clean package -DskipTests
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dspotbugs.skip=true
      - name: OWASP dependency-check aggregate
        run: mvn -B -Dowasp.skip=false org.owasp:dependency-check-maven:aggregate
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: ignore
